name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: The tag, the package and the manifest carry the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          manifest="$(node -p "require('./dist/extension/manifest.json').version")"
          if [ "$tag" != "$package" ] || [ "$tag" != "$manifest" ]; then
            echo "The tag $GITHUB_REF_NAME, the package ($package) and the manifest ($manifest) differ." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run bundle
      - name: The committed build output matches the source
        run: test -z "$(git status --porcelain -- dist/bridge dist/extension skills)"
      - name: Zip the built extension in one folder
        run: |
          cp -R dist/extension clicknote-extension
          zip -r "clicknote-extension-${GITHUB_REF_NAME}.zip" clicknote-extension
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" "clicknote-extension-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
